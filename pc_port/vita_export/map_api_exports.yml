# =============================================================================
# vita-elf-create export config for SilentHillPC (main executable).
#
# Lists every game-code symbol that map overlay .suprx modules need to import
# at runtime (via sceKernelLoadStartModule's native relocation/import-binding,
# NOT dlopen -- see dll_loader.c). This is a CURATED, MEASURED subset, not an
# auto-export-everything list: vita-elf-create -g (auto-generate) hard-fails on
# this exe's full ~12.7k global symbol table ("segment 1 overlaps" -- SCE's
# per-module export table has practical size limits the full symbol set blows
# through). This list was derived empirically: for each of the currently
# enabled map overlays (see maps_vita/CMakeLists.txt), partial-link that map's
# own object files together (resolves intra-map references), then `nm -u` the
# result to find the TRUE external symbols it still needs -- the union of that
# across all enabled maps is exactly this list (plus MapOverlay_VitaRegister,
# the push-model registration glue function -- see dll_loader.c).
#
# Adding a new map overlay to maps_vita/CMakeLists.txt will likely need new
# symbols added here too -- re-run the measurement (see docs/vita_port.md) and
# add any newly-needed entries to the appropriate list below.
# =============================================================================
SilentHillPC:
  attributes: 0
  # process_image: true is REQUIRED for a normal executable (as opposed to a
  # loadable library/module like the map .suprx files this same tool builds
  # -- see maps_vita/module_config.yml.in, which correctly omits it). Without
  # it, vita-elf-create still produces a VELF that boots, but the kernel
  # module-manager treats it as a non-process-image module: sceGxmInitialize
  # gets silently redirected to the VSH-internal sceGxmVshInitialize path
  # (visible in a Vita3K log as "Stubbed sceGxmVshInitialize... (sceGxmInitialize)"),
  # which then collides with the *real* sceGxmCreateContext call right after
  # ("SCE_GXM_ERROR_ALREADY_INITIALIZED"), crashing on the bogus/half-built
  # GXM context (EXCEPTION_ACCESS_VIOLATION reading offset 0x78 into it).
  # This one-line omission is what broke the previously-working plain build
  # the moment this yml got wired in as SilentHillPC's own -e CONFIG.
  process_image: true
  imagemodule: false
  main:
    start: _start
  libraries:
    SilentHillPC_map_api:
      syscall: false
      version: 0x1
      functions:
